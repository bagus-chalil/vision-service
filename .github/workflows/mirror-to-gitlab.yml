name: Mirror to GitLab (CI/CD trigger)
#
# GitHub tetap "source of truth" untuk repo ini. Workflow ini cuma push-mirror
# branch `production` ke project GitLab (branch ini sengaja dipisah dari
# main/v1.0.0 - satu-satunya tujuannya memang buat trigger pipeline pilot,
# bukan branch kerja harian) - begitu GitLab nerima push, .gitlab-ci.yml di
# sana yang jalan (validate + deploy ke VPS). Ini menghindari fitur "pull
# mirror + auto-trigger pipeline" milik GitLab yang di sebagian tier
# berbayar; push biasa dari sini selalu gratis dan selalu men-trigger
# pipeline GitLab standar.
#
# Cara pakai: kalau kode di main/v1.0.0 sudah siap di-pilot-kan, merge/push
# ke branch `production` - itu yang bakal sampai ke VPS, bukan push ke
# branch lain.
#
# Sudah di-setup di GitHub repo settings > Secrets and variables > Actions:
#   - GITLAB_PROJECT_URL : https://gitlab.com/cosmaxidn/vision-service
#   - GITLAB_TOKEN       : GitLab Project Access Token (scope: write_repository)

on:
  push:
    branches:
      - production

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Push mirror to GitLab (production branch only)
        run: |
          set -euo pipefail
          # GITLAB_PROJECT_URL already includes the https:// scheme - strip
          # it so the token can be inserted right after, then push only the
          # production branch (not --all/--tags - this mirror exists only to
          # drive the pilot pipeline, nothing else needs to leave GitHub).
          host_and_path="${GITLAB_PROJECT_URL#https://}"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${host_and_path}.git"
          git push gitlab HEAD:refs/heads/production
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_URL: ${{ secrets.GITLAB_PROJECT_URL }}
