# CI/CD Vision Service ke server .151 (pola VendorHub: Docker Compose + runner shell tag server105).
# GitHub = sumber; .github/workflows/mirror-to-gitlab.yml push-mirror branch `production` ke GitLab.
# Pipeline HANYA untuk branch production. Alur: validasi sintaks -> rsync ke DEPLOY_PATH ->
# docker compose build -> up -d --wait (healthcheck = model sudah termuat) -> smoke test API.
# Bila build/healthcheck gagal, container lama tetap berjalan (compose tidak mengganti
# container sebelum image baru berhasil di-build; up --wait gagal = job merah).
#
# Variabel CI/CD (Settings > CI/CD > Variables, atau grup):
#   VISION_DEPLOY_PATH  mis. /var/www/vision-service
#   VISION_PORT         mis. 8083
#   VISION_ENV_FILE     mis. /etc/vision-service/production.env  (dibuat MANUAL di server, 640 root:gitlab-runner)
# Contoh isi env file: OLLAMA_URL=http://100.100.160.26:11434 ; OLLAMA_MODEL=qwen3.8:27b ;
#   LOAD_PADDLEOCR=1 ; VISION_API_KEY=<rahasia, opsional> ; VISION_SERVICE_ALLOWED_ORIGINS=...

stages:
  - validate
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'

validate:
  stage: validate
  tags: [server105]
  script:
    - python3 -m py_compile main.py tube_emboss_pipeline.py llm_extract.py
    - python3 -c "import json; json.load(open('field_patterns.json'))"
    - python3 -c "import json; json.load(open('emboss_format_patterns.json'))"

deploy_production:
  stage: deploy
  tags: [server105]
  resource_group: production
  environment:
    name: production
  script:
    - test -n "$VISION_DEPLOY_PATH" || (echo "VISION_DEPLOY_PATH belum diset" && exit 1)
    - test -n "$VISION_PORT" || (echo "VISION_PORT belum diset" && exit 1)
    - test -n "$VISION_ENV_FILE" || (echo "VISION_ENV_FILE belum diset" && exit 1)
    - test -f "$VISION_ENV_FILE" || (echo "$VISION_ENV_FILE tidak ada - buat manual dulu" && exit 1)
    - mkdir -p "$VISION_DEPLOY_PATH"
    - >
      rsync -a --no-owner --no-group --delete-after
      --exclude='.git/' --exclude='.github/' --exclude='.gitlab-ci.yml'
      --exclude='venv/' --exclude='testdata_private/' --exclude='debug_output/' --exclude='logs/'
      --exclude='.env'
      "$CI_PROJECT_DIR/" "$VISION_DEPLOY_PATH/"
    - cd "$VISION_DEPLOY_PATH"
    - export COMPOSE_PROJECT_NAME=vision-service-production
    - export COMPOSE_FILE=docker-compose.prod.yml
    - docker compose build
    - docker compose up -d --remove-orphans --wait --wait-timeout 300
    # Smoke test: health + katalog field_type (membuktikan app + config terbaca).
    - curl -fsS "http://localhost:$VISION_PORT/api/health"
    - curl -fsS "http://localhost:$VISION_PORT/api/field-types" > /dev/null
    - docker image prune -f
    - echo "Deployed $CI_COMMIT_SHORT_SHA ke $VISION_DEPLOY_PATH di port $VISION_PORT"
